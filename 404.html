<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkmate · Route not found</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --ink-2: #3a3a3c;
      --muted: #6e6e73; --line: #d2d2d7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink); padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 460px; width: 100%; text-align: center;
      background: var(--card); border: 1px solid rgba(0,0,0,.07);
      border-radius: 20px; padding: 44px 36px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
    }
    .code {
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    h1 { font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.03em; margin: 16px 0 12px; }
    p { color: var(--ink-2); font-size: 15px; line-height: 1.65; margin: 0; }
    a {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 26px;
      height: 44px; padding: 0 22px; border-radius: 980px;
      background: var(--ink); color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 500;
    }
    a:hover { background: #000; }
  </style>
</head>
<body>
  <div class="card">
    <span class="code">404 · route off the board</span>
    <h1>No identity at this square.</h1>
    <p>The requested route was not found. Return to the main board to continue with the Checkmate console.</p>
    <a href="index.html">Back to overview</a>
  </div>
</body>
</html>
