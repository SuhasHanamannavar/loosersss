<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.className += " js";</script>
  <title>Living Green — Sylva</title>
  <meta name="description" content="The moss-root world: pale flowers, ferns, drifting pollen, and native controls behind the full hero layout.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <header class="site-head">
    <a class="brand" href="index.html"><span data-icon="leaf"></span> Sylva</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" data-icon="menu"></button>
    <nav class="pill-nav" aria-label="Primary">
      <a class="seg active" href="living-green.html"><span data-icon="leaf"></span> Grove</a>
      <a class="seg" href="habitats.html"><span data-icon="layers"></span> Habitats</a>
      <a class="seg" href="journal.html"><span data-icon="journal"></span> Journal</a>
      <a class="seg" href="world.html"><span data-icon="enter"></span> Enter</a>
    </nav>
  </header>

  <section class="hero dark" data-parallax-root>
    <div class="hero-bg" data-parallax="6"><img src="assets/img/dark-fog.jpg" alt="Deep olive fog over mossy branches in the old grove"></div>
    <canvas class="dust-canvas" aria-hidden="true"></canvas>
    <svg class="butterfly" viewBox="0 0 34 26" fill="none" aria-hidden="true">
      <path d="M17 13C14 6 8 3 4 6c-3 2-1 8 6 10 3 1 5-1 7-3z" fill="#dfe9a8"/>
      <path d="M17 13c3-7 9-10 13-7 3 2 1 8-6 10-3 1-5-1-7-3z" fill="#cddc8e"/>
      <path d="M17 8v10" stroke="#6b7a3f" stroke-width="1.4"/>
    </svg>
    <div class="wrap hero-inner">
      <div class="hero-copy" data-reveal>
        <h1 class="hero-title">Step into<br>the living world</h1>
        <p class="hero-lede">We restore wild places through patient design, native planting, and a deeper kind of stewardship.</p>
        <div class="hero-actions">
          <a class="btn-pill" href="index.html#journey"><span data-icon="leaf"></span> Explore the work</a>
          <a class="play-ring" href="journal.html" aria-label="Open the field note"><span data-icon="play"></span></a>
        </div>
      </div>
      <aside class="hero-side" data-reveal data-delay="2">
        <div class="stat-row">
          <div class="stat-chip">
            <span data-icon="canopy"></span>
            <span><span class="lbl">Canopy restored</span><span class="val"><span data-count="282">0</span> ha</span></span>
          </div>
          <div class="stat-chip">
            <span data-icon="sun"></span>
            <span><span class="lbl">Native species</span><span class="val"><span data-count="43">0</span> mapped</span></span>
          </div>
        </div>
        <a class="float-card" href="ethos.html">
          <div class="thumb"><img src="assets/img/moss-stones.jpg" alt="Mossy stones with small ferns"></div>
          <span class="kicker">Our Ethos</span>
          <div class="card-foot">
            <h3>Let the wild lead.</h3>
            <span class="go-round" data-icon="arrow-down"></span>
          </div>
        </a>
        <a class="float-card off" href="journal.html">
          <div class="thumb"><img src="assets/img/after-rain.jpg" alt="Fog among mossy boulders after rain"></div>
          <span class="kicker">Field Note 07</span>
          <div class="card-foot">
            <h3>After the Rain</h3>
            <span class="go-round" data-icon="arrow-down"></span>
          </div>
        </a>
      </aside>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
</body>
</html>
